<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clippy Chat — w1c spike</title>
<link rel="stylesheet" href="vendor/w1c/w1c.css">
<script src="vendor/w1c/w1c.bundle.js"></script>
<script src="vendor/marked/marked.umd.js"></script>
<script src="sanitize.js"></script>
<script>
  // Instrumentation (probe harness): body[data-w1c] reports bundle load/upgrade state.
  document.body.dataset.w1c = 'bundle-empty';
  window.addEventListener('error', function (e) {
    document.body.dataset.w1c = 'pg-err ' + e.message;
  });
  window.addEventListener('unhandledrejection', function (e) {
    document.body.dataset.w1c = 'pg-reject ' + String(e.reason);
  });
</script>
<style>
  html, body {
    background: transparent;
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-size: 13px;
  }
  body {
    font: 13px/1.3 var(--w1c-font-ui, 'MS Sans Serif', Tahoma, sans-serif);
    color: var(--w1c-control-text, #000);
  }
  .pane {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  w1c-window.app {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    --w1c-window-content-padding: 0px;
  }
  w1c-window.app::part(chrome) {
    flex: 1;
    min-height: 0;
  }
  .tb-spacer {
    display: block;
    height: 0;
    overflow: hidden;
  }
  w1c-window.app::part(content) {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .pane-resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    z-index: 100;
    background:
      linear-gradient(135deg, transparent 0 48%, #404040 49% 53%, transparent 54%)
        right 2px bottom 2px / 8px 8px no-repeat,
      linear-gradient(135deg, transparent 0 48%, #808080 49% 53%, transparent 54%)
        right 5px bottom 2px / 8px 8px no-repeat;
  }
  .ico {
    width: 16px;
    height: 16px;
    display: inline-block;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ffff00'/><g fill='%23000000'><rect x='2' y='2' width='12' height='12' fill='none' stroke='%23000000'/><rect x='4' y='4' width='8' height='7'/><rect x='4' y='12' width='2' height='2'/><rect x='10' y='12' width='2' height='2'/></g></svg>") no-repeat center;
  }
  .pane-body {
    flex: 1;
    min-height: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
  }
  .msg {
    max-width: 92%;
    margin: 4px 0;
    padding: 5px 7px;
    word-wrap: break-word;
    background: #fff;
    border: 1px solid #808080;
    box-shadow: 1px 1px 0 #fff inset, -1px -1px 0 #808080 inset;
  }
  .msg.you { margin-left: auto; background: #ffffe1; }
  .msg.img { padding: 3px; background: #c0c0c0; }
  .msg.img img { width: 100%; height: auto; image-rendering: pixelated; }
  /* Markdown formatting inside assistant bubbles (the reasoning stream). */
  .msg .md { font: 13px/1.4 var(--w1c-font-ui, 'MS Sans Serif', Tahoma, sans-serif); }
  .msg .md > :first-child { margin-top: 0; }
  .msg .md > :last-child { margin-bottom: 0; }
  .msg .md p { margin: 4px 0; }
  .msg .md h1, .msg .md h2, .msg .md h3,
  .msg .md h4, .msg .md h5, .msg .md h6 {
    margin: 6px 0 3px;
    font-weight: bold;
  }
  .msg .md h1 { font-size: 15px; }
  .msg .md h2 { font-size: 14px; }
  .msg .md h3 { font-size: 13px; }
  .msg .md h4, .msg .md h5, .msg .md h6 { font-size: 12px; }
  .msg .md ul, .msg .md ol { margin: 4px 0; padding-left: 20px; }
  .msg .md li { margin: 1px 0; }
  .msg .md a { color: #000080; text-decoration: underline; }
  .msg .md strong { font-weight: bold; }
  .msg .md em { font-style: italic; }
  .msg .md code {
    font: 12px/1.4 var(--w1c-font-mono, 'Courier New', monospace);
    background: #e8e8e8;
    border: 1px solid #b0b0b0;
    padding: 0 3px;
  }
  .msg .md pre {
    margin: 5px 0;
    padding: 5px;
    background: #ececec;
    border: 1px solid #808080;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg .md pre code { background: none; border: none; padding: 0; }
  .msg .md blockquote {
    margin: 4px 0;
    padding: 2px 8px;
    border-left: 3px solid #808080;
    color: #404040;
  }
  .msg .md hr { border: none; border-top: 1px solid #808080; margin: 6px 0; }
  .msg .md table { border-collapse: collapse; margin: 5px 0; }
  .msg .md th, .msg .md td { border: 1px solid #808080; padding: 2px 6px; }
  .msg .md th { background: #d4d0c8; font-weight: bold; }
  /* Live-stream bubble: the reasoning stream as it arrives, one bubble per turn. */
  .msg.clippy.streaming::after {
    content: '▌';
    display: inline-block;
    margin-left: 2px;
    color: #000080;
    animation: clippy-caret 1s steps(1) infinite;
  }
  @keyframes clippy-caret { 50% { opacity: 0; } }
  .msg .md .thinking {
    margin-bottom: 6px;
    padding: 3px 6px;
    border: 1px dashed #808080;
    background: #f4f4f4;
  }
  .msg .md .thinking summary { cursor: pointer; font-weight: bold; color: #404040; }
  .msg .md .thinking[open] summary { margin-bottom: 2px; }
  .card {
    margin: 0 6px 6px;
    padding: 6px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  progress {
    width: 100%;
    height: 14px;
    border: 1px solid #808080;
    box-shadow: 1px 1px 0 #fff inset, -1px -1px 0 #d4d0c8 inset;
    background: #fff;
    color: #000080;
  }
  progress::-webkit-progress-bar { background: #fff; }
  progress::-webkit-progress-value { background: #000080; }
  output { font-size: 12px; min-width: 34px; text-align: right; }
  .statusbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .modebadge { font-weight: bold; }
  .modebadge.sandbox { color: #000080; }
  .modebadge.build { color: #800000; }
  #jsstate { color: #008000; }
  .input-bar {
    display: flex;
    gap: 6px;
    padding: 6px;
    border-top: 1px solid #808080;
    box-shadow: inset 0 1px 0 #fff;
    flex-shrink: 0;
  }
  w1c-input#chatinput { flex: 1; }
</style>
</head>
<body>
  <div class="pane">
    <w1c-window class="app" title="Clippy Chat">
      <span slot="icon" class="ico"></span>
      <div slot="toolbar" class="tb-spacer"></div>
      <div class="pane-body">
        <div class="chat" id="chat">
          <div class="msg clippy">Hi — I'm Clippy. Ask me anything, or /skill something.</div>
        </div>
      </div>
      <span slot="statusbar" class="statusbar">
        <span id="modebadge" class="modebadge">🛡 sandbox</span>
        <span id="jsstate">JS booting…</span>
        <span>w1c · bridge active</span>
      </span>
      <div class="input-bar">
        <w1c-input id="chatinput" placeholder="type a message…"></w1c-input>
        <w1c-button id="sendbtn">Send</w1c-button>
      </div>
    </w1c-window>
    <div id="paneResizeHandle" class="pane-resize-handle" title="Resize"></div>
  </div>
<script>
  const prog = document.getElementById('prog');
  const progv = document.getElementById('progv');
  const jsstate = document.getElementById('jsstate');
  const chat = document.getElementById('chat');
  const input = document.getElementById('chatinput');
  const BRIDGE = 'clippy';

  function bridgeOK() {
    return window.webkit && window.webkit.messageHandlers &&
      window.webkit.messageHandlers[BRIDGE];
  }
  function post(type, payload) {
    if (!bridgeOK()) return false;
    window.webkit.messageHandlers[BRIDGE].postMessage(
      JSON.stringify(Object.assign({ type: type }, payload || {})));
    return true;
  }
  window.addEventListener('error', function (e) {
    post('debug', { text: 'error:' + ((e && e.message) || 'unknown') });
  });
  // --------------------------------------------------- markdown rendering
  // The reasoning stream arrives as markdown; render it to HTML inside the
  // bubble. Raw HTML the model emits is sanitized (no scripts/event handlers).
  const MD = {
    gfm: true,
    breaks: false,
  };
  // Allowlist sanitizer lives in sanitize.js (pure predicates + DOM walk).
  // Fail CLOSED if it did not load: drop the HTML rather than render it raw.
  const sanitizeHtml = (window.ClipSanitize && window.ClipSanitize.sanitize)
    || ((root) => {
         console.error('ClipSanitize missing — refusing to render HTML');
         while (root.firstChild) root.removeChild(root.firstChild);
         return root;
       });
  function renderMarkdown(text) {
    if (!text || !text.trim()) return '';
    let html;
    try {
      html = marked.parse(String(text), MD);
    } catch (_) {
      return '';
    }
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    const box = document.createElement('div');
    box.className = 'md';
    box.appendChild(sanitizeHtml(tpl.content));
    return box;
  }
  function setMarkdown(container, text) {
    container.textContent = '';
    const box = renderMarkdown(text);
    if (box) container.appendChild(box);
  }
  function addMessage(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'you' ? 'you' : 'clippy');
    if (role === 'you') {
      d.textContent = text;
    } else {
      setMarkdown(d, text);
    }
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }
  // Live reasoning stream: one growing bubble per agent run. Python re-sends
  // the full accumulated thinking/answer text (itself throttled on the Python
  // side); marked renders the partial markdown, so formatting appears as it
  // streams. Deltas can still arrive faster than the pane can re-parse +
  // re-render the whole buffer, so coalesce them too: render at most once per
  // ~50ms, always flushing the latest before a bubble is finalized.
  let currentStream = null;
  let streamTimer = null;
  let pendingRender = null;
  function flushStreamRender() {
    if (streamTimer) { clearTimeout(streamTimer); streamTimer = null; }
    const fn = pendingRender;
    pendingRender = null;
    if (fn) fn();
  }
  function scheduleStreamRender(fn) {
    pendingRender = fn;
    if (streamTimer) return;
    streamTimer = setTimeout(() => {
      streamTimer = null;
      const f = pendingRender;
      pendingRender = null;
      if (f) f();
    }, 50);
  }
  function finalizeStream(finalText) {
    // Render any coalesced delta before swapping in the final text.
    flushStreamRender();
    // If the turn never streamed (e.g. an answer arrives with no deltas),
    // open the bubble now so the final text still surfaces in the pane.
    let s = currentStream;
    if (!s && typeof finalText === 'string' && finalText.trim()) {
      s = makeStreamBubble();
    }
    if (!s) return;
    // Replace the streamed answer only when a non-empty final arrived. An
    // empty final (e.g. the safety-net close from `settled`) just closes the
    // bubble, preserving whatever streamed in.
    if (typeof finalText === 'string' && finalText.trim()) {
      s.answer.textContent = '';
      const box = renderMarkdown(finalText);
      if (box) s.answer.appendChild(box);
    }
    // Hide the thinking box entirely when the turn produced no reasoning.
    if (!s.thinking.textContent.trim()) {
      s.details.style.display = 'none';
    }
    s.el.classList.remove('streaming');
    s.el.removeAttribute('data-streaming');
    currentStream = null;
    chat.scrollTop = chat.scrollHeight;
  }
  function makeStreamBubble() {
    if (currentStream) finalizeStream();
    const el = document.createElement('div');
    el.className = 'msg clippy streaming';
    el.dataset.streaming = '1';
    const thinking = document.createElement('details');
    thinking.className = 'thinking';
    thinking.open = false;
    const sum = document.createElement('summary');
    sum.textContent = 'Thinking…';
    const thinkBody = document.createElement('div');
    thinking.appendChild(sum);
    thinking.appendChild(thinkBody);
    const answer = document.createElement('div');
    el.appendChild(thinking);
    el.appendChild(answer);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    currentStream = { el, thinking: thinkBody, answer, details: thinking, summary: sum };
    return currentStream;
  }
  function streamThinking(text) {
    const s = currentStream || makeStreamBubble();
    if (text && text.trim()) {
      s.details.open = true;
      s.summary.textContent = 'Thinking';
      scheduleStreamRender(() => {
        setMarkdown(s.thinking, text);
        chat.scrollTop = chat.scrollHeight;
      });
    }
  }
  function streamText(text) {
    const s = currentStream || makeStreamBubble();
    if (text) {
      scheduleStreamRender(() => {
        setMarkdown(s.answer, text);
        chat.scrollTop = chat.scrollHeight;
      });
    }
  }
  function send() {
    const t = input.value ? String(input.value).trim() : '';
    if (!t) return;
    addMessage('you', t);
    input.value = '';
    jsstate.textContent = post('chat', { text: t }) ? 'sent…' : 'no bridge';
  }

  jsstate.textContent = 'JS BOOTED';   // synchronous, timer-independent proof
  window.__addMessage = addMessage;
  window.__streamStart = function () { makeStreamBubble(); };
  window.__streamThinking = function (text) { streamThinking(text); };
  window.__streamText = function (text) { streamText(text); };
  window.__streamEnd = function (finalText) { finalizeStream(finalText); };
  window.__focusInput = function () { input.focus({ preventScroll: true }); };
  window.__setProgress = function (v) {
    if (!prog || !progv) return;
    prog.value = Math.round(v);
    progv.textContent = Math.round(v) + '%';
    jsstate.textContent = 'JS LIVE ' + Math.round(v) + '%';
  };
  window.__setMode = function (m) {
    const b = document.getElementById('modebadge');
    if (!b) return;
    b.textContent = m === 'build' ? '🔨 build' : '🛡 sandbox';
    b.className = 'modebadge ' + (m === 'build' ? 'build' : 'sandbox');
  };
  // Mock user message: exercises JS -> bridge -> Python -> JS round trip.
  window.__sendMock = function (text) {
    const t = text || 'hello from js (mock user)';
    addMessage('you', t);
    post('chat', { text: t });
  };
  // Tab toggles sandbox <-> build. The toggle is otherwise bound to the avatar
  // window's key handler, which doesn't have focus while typing here.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      post('mode_toggle', {});
      jsstate.textContent = 'mode_toggle…';
    }
  });
  // ------------------------------------------------------------- dialogs
  // Render a Pi `extension_ui_request` (confirm/select/input/editor/notify)
  // as a w1c card in the chat area and post the answer back.
  function dialogCard(event) {
    const card = document.createElement('div');
    card.className = 'msg clippy card dialog';
    card.dataset.id = event.id;
    const head = document.createElement('div');
    head.className = 'dialog-head';
    head.textContent = (event.method || 'request').toUpperCase();
    card.appendChild(head);
    if (event.message || event.title) {
      const body = document.createElement('div');
      body.className = 'dialog-body';
      body.textContent = event.message || event.title;
      card.appendChild(body);
    }
    return card;
  }
  function dialogButtons(card, labels, isConfirm) {
    const row = document.createElement('div');
    row.className = 'dialog-buttons';
    for (const label of labels) {
      const b = document.createElement('w1c-button');
      b.textContent = label;
      b.addEventListener('click', () => {
        post('debug', { text: 'click:' + label + ':' + card.dataset.id });
        row.querySelectorAll('w1c-button').forEach((x) => { x.disabled = true; });
        let payload;
        if (label === labels[0]) {
          payload = isConfirm ? { confirmed: true } : { value: card.__value };
        } else {
          payload = isConfirm ? { confirmed: false } : { cancelled: true };
        }
        post('ui_response', Object.assign({ id: card.dataset.id }, payload));
      });
      row.appendChild(b);
    }
    card.appendChild(row);
    return row;
  }
  function addField(card, node) {
    const wrap = document.createElement('div');
    wrap.className = 'dialog-field';
    wrap.appendChild(node);
    card.appendChild(wrap);
    return node;
  }
  window.__uiRequest = function (event) {
    if (!event || !event.id) return;
    const m = event.method;
    const card = dialogCard(event);
    if (m === 'notify') {
      chat.appendChild(card);
      chat.scrollTop = chat.scrollHeight;
      return;
    }
    if (m === 'confirm') {
      dialogButtons(card, ['Allow', 'Deny'], true);
    } else if (m === 'review') {
      // Clippy-originated: how should a sub-clippy run? Allow = command access,
      // Read-only = sandbox, Suggest = sandbox + guidance, Dismiss = don't run.
      const ta = document.createElement('textarea');
      ta.style.cssText = 'width:100%;height:64px;box-sizing:border-box;'
        + 'font:12px/1.3 monospace;';
      ta.placeholder = event.placeholder || 'Optional guidance for the sub-clippy…';
      addField(card, ta);
      const row = document.createElement('div');
      row.className = 'dialog-buttons';
      const choose = (label, makePayload) => {
        const b = document.createElement('w1c-button');
        b.textContent = label;
        b.addEventListener('click', () => {
          row.querySelectorAll('w1c-button').forEach((x) => { x.disabled = true; });
          const payload = typeof makePayload === 'function' ? makePayload() : makePayload;
          post('ui_response', Object.assign({ id: card.dataset.id }, payload));
        });
        row.appendChild(b);
      };
      choose('Allow', { decision: 'allow' });
      choose('Read-only', { decision: 'deny' });
      choose('Suggest', () => ({ decision: 'suggest', suggestion: ta.value }));
      choose('Dismiss', { decision: 'dismiss' });
      card.appendChild(row);
    } else if (m === 'select') {
      const sel = document.createElement('w1c-select');
      (event.options || []).forEach((opt) => {
        const o = document.createElement('option');
        o.textContent = opt;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => { card.__value = sel.value; });
      addField(card, sel);
      dialogButtons(card, ['OK', 'Cancel']);
    } else if (m === 'input') {
      const inp = document.createElement('w1c-input');
      inp.placeholder = event.placeholder || '';
      inp.value = event.default || '';
      inp.addEventListener('change', () => { card.__value = inp.value; });
      addField(card, inp);
      dialogButtons(card, ['OK', 'Cancel']);
    } else if (m === 'editor') {
      const ta = document.createElement('textarea');
      ta.style.cssText = 'width:100%;height:120px;';
      ta.value = event.default || '';
      ta.addEventListener('input', () => { card.__value = ta.value; });
      addField(card, ta);
      dialogButtons(card, ['OK', 'Cancel']);
    } else {
      dialogButtons(card, ['OK']);
    }
    chat.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
    jsstate.textContent = 'ui:' + m;
    post('debug', { text: 'card:' + m + ':' + event.id });
  };
  // Prove the w1c bundle actually registered our components.
  if (customElements.get('w1c-window')) {
    document.body.dataset.w1c = 'ready';
  } else {
    customElements.whenDefined('w1c-window')
      .then(() => { document.body.dataset.w1c = 'ready'; jsstate.textContent = 'W1C READY'; })
      .catch(() => { document.body.dataset.w1c = 'define-fail'; });
    setTimeout(() => {
      if (document.body.dataset.w1c === 'bundle-empty') document.body.dataset.w1c = 'bundle-silent';
    }, 1000);
  }
  sendbtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });
  // Pane geometry: the w1c title bar drags the pane; a bottom-right handle
  // resizes it. JS only signals drag start/end — the host polls the cursor's
  // AppKit screen position each frame and moves the panel to track it, so
  // there's no webview-delta feedback (the source of the runaway/jerky motion).
  const win = document.querySelector('w1c-window.app');
  const handle = document.getElementById('paneResizeHandle');

  function titlebarHeight() {
    try {
      const tb = win.shadowRoot && win.shadowRoot.querySelector('[part="titlebar"]');
      if (tb) return tb.getBoundingClientRect().height + 2;
    } catch (_) { /* pre-upgrade */ }
    return 28;
  }

  win.addEventListener('pointerdown', (e) => {
    const r = win.getBoundingClientRect();
    if (e.clientY - r.top < titlebarHeight()) {
      post('pane_move', { phase: 'start' });
      win.setPointerCapture(e.pointerId);
    }
  });
  win.addEventListener('pointerup', () => post('pane_move', { phase: 'end' }));
  win.addEventListener('pointercancel', () => post('pane_move', { phase: 'end' }));

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    post('pane_resize', { phase: 'start' });
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointerup', () => post('pane_resize', { phase: 'end' }));
  handle.addEventListener('pointercancel', () => post('pane_resize', { phase: 'end' }));

  // Keep the resize handle pinned to the w1c window's actual bottom-right
  // corner, even if the webview layout viewport lags behind the panel size.
  function placeHandle() {
    const r = win.getBoundingClientRect();
    handle.style.left = (r.right - handle.offsetWidth) + 'px';
    handle.style.top = (r.bottom - handle.offsetHeight) + 'px';
  }
  placeHandle();
  try { new ResizeObserver(placeHandle).observe(win); } catch (_) {}
  window.addEventListener('resize', placeHandle);
</script>
</body>
</html>
